<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>own-ai · 桌面</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262a33; --fg:#e6e6e6; --dim:#8a8f9c; --accent:#5b9cff; --ok:#3ecf8e; --err:#ff6b6b; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif; display:flex; flex-direction:column; height:100vh }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel) }
  header b { font-weight:600 }
  #status { font-size:13px; color:var(--dim) }
  #status.ok { color:var(--ok) } #status.err { color:var(--err) }
  header .sp { flex:1 }
  header button { background:none; border:1px solid var(--line); color:var(--dim); border-radius:6px; padding:4px 10px; cursor:pointer }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px }
  .msg { max-width:800px; padding:10px 14px; border-radius:10px; white-space:pre-wrap; word-break:break-word }
  .user { align-self:flex-end; background:#243b63 }
  .ai { align-self:flex-start; background:var(--panel); border:1px solid var(--line) }
  .tool { align-self:flex-start; font:13px/1.5 ui-monospace,Consolas,monospace; color:var(--dim); border-left:2px solid var(--line); padding:4px 10px; max-width:800px }
  .tool summary { cursor:pointer; color:var(--accent) }
  .tool pre { margin:6px 0 0; white-space:pre-wrap; max-height:240px; overflow:auto; color:var(--fg) }
  .error { align-self:flex-start; color:var(--err) }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel) }
  textarea { flex:1; resize:none; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; min-height:44px; max-height:200px }
  form button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 18px; cursor:pointer; font:inherit }
  form button:disabled { opacity:.5; cursor:default }
  #setup { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center }
  #setup .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px; width:min(420px,90vw); display:flex; flex-direction:column; gap:10px }
  #setup input { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit }
  #setup small { color:var(--dim) }
</style>
</head>
<body>
<header>
  <b>own-ai</b> <span id="status">未連線</span>
  <span class="sp"></span>
  <button id="reset" title="清除對話記憶">重置</button>
  <button id="cfg" title="重新設定連線">設定</button>
</header>
<div id="log"></div>
<form id="f">
  <textarea id="in" placeholder="輸入訊息… (Enter 送出，Shift+Enter 換行)" rows="1"></textarea>
  <button id="send" type="submit">送出</button>
</form>

<div id="setup" hidden>
  <div class="card">
    <b>連線到你電腦上的 AI</b>
    <small>先在電腦上執行 <code>uv run server.py</code>，把終端機印出的 Token 貼到這裡。</small>
    <input id="url" placeholder="ws://127.0.0.1:8765/ws">
    <input id="tok" placeholder="Token">
    <button id="save">連線</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const log = $('#log'), status = $('#status'), input = $('#in'), sendBtn = $('#send');
let ws, busy = false, current = null;

const cfg = {
  get url() { return localStorage.getItem('ai.url') || 'ws://127.0.0.1:8765/ws'; },
  get tok() { return localStorage.getItem('ai.tok') || ''; },
  set(url, tok) { localStorage.setItem('ai.url', url); localStorage.setItem('ai.tok', tok); },
};

function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function addTool(name, args) {
  const d = document.createElement('details'); d.className = 'tool';
  d.innerHTML = `<summary>⚙ ${name}</summary><pre class="a"></pre><pre class="r"></pre>`;
  d.querySelector('.a').textContent = args;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

function connect() {
  if (!cfg.tok) { $('#setup').hidden = false; return; }
  status.textContent = '連線中…'; status.className = '';
  ws = new WebSocket(`${cfg.url}?token=${encodeURIComponent(cfg.tok)}`);
  ws.onopen = () => { status.textContent = '已連線'; status.className = 'ok'; };
  ws.onclose = e => {
    status.className = 'err';
    status.textContent = e.code === 4401 ? 'Token 錯誤' : '已斷線（伺服器有開嗎？）';
    if (e.code === 4401) $('#setup').hidden = false;
    else setTimeout(connect, 3000);
  };
  ws.onmessage = ({ data }) => {
    const ev = JSON.parse(data);
    switch (ev.type) {
      case 'hello': status.textContent = `已連線 · ${ev.backend} / ${ev.model}`; break;
      case 'text': add('ai', ev.content); break;
      case 'tool_call': current = addTool(ev.name, ev.arguments); break;
      case 'tool_result': if (current) current.querySelector('.r').textContent = '→ ' + ev.result.slice(0, 2000); break;
      case 'error': add('error', '✗ ' + ev.message); setBusy(false); break;
      case 'done': setBusy(false); break;
      case 'reset': log.innerHTML = ''; break;
    }
  };
}
function setBusy(b) { busy = b; sendBtn.disabled = b; if (!b) input.focus(); }

$('#f').onsubmit = e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy || ws?.readyState !== 1) return;
  add('user', text); ws.send(JSON.stringify({ message: text }));
  input.value = ''; input.style.height = 'auto'; setBusy(true);
};
input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#f').requestSubmit(); } };
input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; };
$('#reset').onclick = () => ws?.send(JSON.stringify({ action: 'reset' }));
$('#cfg').onclick = () => { $('#url').value = cfg.url; $('#tok').value = cfg.tok; $('#setup').hidden = false; };
$('#save').onclick = () => { cfg.set($('#url').value.trim(), $('#tok').value.trim()); $('#setup').hidden = true; ws?.close(); connect(); };

connect();
</script>
</body>
</html>
